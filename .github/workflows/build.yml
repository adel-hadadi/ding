name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: "false"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: |
          cargo build --release --locked -p ding-client --bins
          cargo build --release --locked -p ding-server

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/ding target/release/ding-gui target/release/ding-server dist/
          cp packaging/linux/com.adelhadadi.ding.desktop \
             packaging/linux/com.adelhadadi.ding.svg \
             packaging/linux/install.sh \
             dist/
          chmod +x dist/ding dist/ding-gui dist/ding-server dist/install.sh packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ding-linux-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Release build (Apple Silicon)
        run: |
          cargo build --release --locked -p ding-client --bins
          cargo build --release --locked -p ding-server

      - name: Release build (Intel)
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p ding-client --bins
          cargo build --release --locked --target x86_64-apple-darwin -p ding-server

      - name: Stage Apple Silicon app
        run: |
          mkdir -p dist-arm64
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh target/release/ding-gui dist-arm64/Ding.app
          cp target/release/ding target/release/ding-server dist-arm64/
          chmod +x dist-arm64/ding dist-arm64/ding-server

      - name: Stage Intel app
        run: |
          mkdir -p dist-x64
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh target/x86_64-apple-darwin/release/ding-gui dist-x64/Ding.app
          cp target/x86_64-apple-darwin/release/ding \
             target/x86_64-apple-darwin/release/ding-server \
             dist-x64/
          chmod +x dist-x64/ding dist-x64/ding-server

      - uses: actions/upload-artifact@v4
        with:
          name: ding-macos-arm64
          path: dist-arm64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ding-macos-x64
          path: dist-x64/
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: |
          cargo build --release --locked -p ding-client --bins
          cargo build --release --locked -p ding-server

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ding.exe, target/release/ding-gui.exe, target/release/ding-server.exe dist/
          Copy-Item packaging/windows/install.ps1, packaging/windows/install.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ding-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          mkdir -p dist
          find artifacts/ding-linux-x64 -name '*.deb' -exec cp {} dist/ \;
          for name in ding-linux-x64 ding-macos-arm64 ding-macos-x64 ding-windows-x64; do
            (cd "artifacts/${name}" && zip -r "${GITHUB_WORKSPACE}/dist/${name}.zip" . -x '*.deb')
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.deb
          generate_release_notes: true
