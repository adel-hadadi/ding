name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: "false"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: |
          cargo build --release --locked -p ding-client --bins
          cargo build --release --locked -p ding-server

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/ding target/release/ding-gui target/release/ding-server dist/
          chmod +x dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ding-linux-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Release build (Apple Silicon)
        run: |
          cargo build --release --locked -p ding-client --bins
          cargo build --release --locked -p ding-server

      - name: Release build (Intel)
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p ding-client --bins
          cargo build --release --locked --target x86_64-apple-darwin -p ding-server

      - name: Stage Apple Silicon binaries
        run: |
          mkdir -p dist-arm64
          cp target/release/ding target/release/ding-gui target/release/ding-server dist-arm64/
          chmod +x dist-arm64/*

      - name: Stage Intel binaries
        run: |
          mkdir -p dist-x64
          cp target/x86_64-apple-darwin/release/ding \
             target/x86_64-apple-darwin/release/ding-gui \
             target/x86_64-apple-darwin/release/ding-server \
             dist-x64/
          chmod +x dist-x64/*

      - uses: actions/upload-artifact@v4
        with:
          name: ding-macos-arm64
          path: dist-arm64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ding-macos-x64
          path: dist-x64/
          if-no-files-found: error
